name: Daily YouTube Short

on:
  schedule:
    - cron: '30 12 * * *'
  workflow_dispatch:
    inputs:
      channel:
        description: 'Target YouTube Channel'
        type: choice
        options:
          - Auto-Detect from Idea
          - Bhakti Marg
          - Biography of Hindu Saints
          - The Lean Bites
          - I am Abhinanden
        default: Auto-Detect from Idea
      video_idea:
        description: 'Video Idea / Broad Theme (leave blank to use Google Sheet queue)'
        type: string
        required: false
        default: ''
      video_count:
        description: 'Number of videos to create'
        type: choice
        options:
          - '1'
          - '2'
          - '3'
          - '4'
          - '5'
        default: '3'
      language:
        description: 'Fallback Video & Subtitle Language'
        type: choice
        options:
          - Hindi
          - English
          - Bengali
        default: Hindi
      dry_run:
        description: 'Dry run (test Sheet & credentials at $0 cost, skip video/upload)'
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install FFmpeg and multilingual fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core fonts-noto-core
          pip install -r requirements.txt

      - name: Write GCP Service Account Key
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: python -c "import os; open('gcp_sa_key.json', 'w').write(os.environ['GCP_SA_KEY'])"

      - name: Generate and Upload YouTube Shorts Batch
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_APPLICATION_CREDENTIALS: gcp_sa_key.json
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
          YT_TOKEN_BHAKTI_MARG: ${{ secrets.YT_TOKEN_BHAKTI_MARG }}
          YT_TOKEN_HINDU_SAINTS: ${{ secrets.YT_TOKEN_HINDU_SAINTS }}
          YT_TOKEN_LEAN_BITES: ${{ secrets.YT_TOKEN_LEAN_BITES }}
          TARGET_CHANNEL: ${{ inputs.channel || 'Auto-Detect from Idea' }}
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
          TARGET_LANGUAGE: ${{ inputs.language || 'Hindi' }}
          VIDEO_IDEA: ${{ inputs.video_idea || '' }}
          VIDEO_COUNT: ${{ inputs.video_count || '3' }}
        run: python generate_and_upload.py

      - name: Cleanup temporary key
        if: always()
        run: rm -f gcp_sa_key.json
