name: Daily YouTube Short

on:
  schedule:
    # Runs daily at 12:30 UTC (6:00 PM IST)
    - cron: '30 12 * * *'
  workflow_dispatch:
    inputs:
      language:
        description: 'Video & Subtitle Language'
        type: choice
        options:
          - Hindi
          - English
          - Bengali
        default: Hindi
      dry_run:
        description: 'Dry run (skip build and upload)'
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install FFmpeg and multilingual fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core fonts-noto-core
          pip install -r requirements.txt

      - name: Write GCP Service Account Key
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: python -c "import os; open('gcp_sa_key.json', 'w').write(os.environ['GCP_SA_KEY'])"

      - name: Generate and Upload YouTube Short
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_APPLICATION_CREDENTIALS: gcp_sa_key.json
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
          DRY_RUN: ${{ inputs.dry_run }}
          TARGET_LANGUAGE: ${{ inputs.language || 'Hindi' }}
        run: python generate_and_upload.py

      - name: Cleanup and commit updated topics.json
        if: always()
        run: |
          rm -f gcp_sa_key.json
          if [ "${{ inputs.dry_run }}" != "true" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add topics.json
            git diff --staged --quiet || git commit -m "chore: mark Short published"
            git push
          fi
