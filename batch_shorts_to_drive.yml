name: Batch Generate Shorts to Google Drive

on:
  # Allows you to trigger a batch manually from the GitHub Actions tab and set how many videos to generate
  workflow_dispatch:
    inputs:
      batch_size:
        description: 'Number of Shorts to generate in this run'
        required: true
        default: '10'
        type: string

  # Optional: Runs automatically every 6 hours to steadily use your credits
  schedule:
    - cron: '0 */6 * * *'

jobs:
  generate-batch:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install google-api-python-client google-auth

      - name: Write Google Drive Service Account JSON
        env:
          DRIVE_CREDS_JSON: ${{ secrets.DRIVE_CREDS_JSON }}
        run: |
          printf '%s' "$DRIVE_CREDS_JSON" > drive_creds.json

      - name: Run Batch Shorts Generator
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DRIVE_FOLDER_ID: '1CfuVvXdpUtYzcYkFa9R9ashU4NyFrJo6'
          BATCH_SIZE: ${{ github.event.inputs.batch_size || '10' }}
        run: |
          python generate_and_upload.py

      - name: Commit updated topics.json (if modified)
        if: always()
        run: |
          rm -f drive_creds.json
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add topics.json
          git diff --staged --quiet || git commit -m "chore: update generated topics log"
          git push
